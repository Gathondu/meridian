[project]
name = "meridian-api"
version = "0.1.0"
description = "Meridian FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0,<2",
    "fastapi>=0.115.6,<0.117",
    "fastmcp>=3.2.4",
    "openai>=1.59.0,<2",
    "pydantic-settings>=2.14.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.34.0,<0.36",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_api"]

[tool.fastapi]
entrypoint = "meridian_api.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
