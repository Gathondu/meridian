name: Deploy to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_VAR_project_name: ${{ vars.TF_VAR_project_name || 'meridian' }}
  TF_VAR_api_image_tag: ${{ github.sha }}
  TF_VAR_mcp_server_url: ${{ secrets.MCP_SERVER_URL }}
  TF_VAR_mcp_server_headers_json: ${{ secrets.MCP_SERVER_HEADERS_JSON }}
  TF_VAR_cors_origins_extra: ${{ vars.TF_VAR_cors_origins_extra }}
  TF_VAR_log_level: ${{ vars.TF_VAR_log_level || 'INFO' }}
  TF_VAR_log_json: ${{ vars.TF_VAR_log_json || 'true' }}
  TF_VAR_rate_limit_default: ${{ vars.TF_VAR_rate_limit_default || '120/minute' }}
  TF_VAR_request_id_header: ${{ vars.TF_VAR_request_id_header || 'X-Request-ID' }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OPENAI_MODEL / OPENAI_BASE_URL: optional secrets (same names as backend env) override repo variables.
      - name: Set OpenAI Terraform variables
        env:
          S_MODEL: ${{ secrets.OPENAI_MODEL }}
          V_MODEL: ${{ vars.TF_VAR_openai_model }}
          S_BASE: ${{ secrets.OPENAI_BASE_URL }}
          V_BASE: ${{ vars.TF_VAR_openai_base_url }}
        run: |
          if [ -n "$S_MODEL" ]; then echo "TF_VAR_openai_model=$S_MODEL" >> "$GITHUB_ENV"
          elif [ -n "$V_MODEL" ]; then echo "TF_VAR_openai_model=$V_MODEL" >> "$GITHUB_ENV"
          else echo "TF_VAR_openai_model=gpt-4o-mini" >> "$GITHUB_ENV"
          fi
          if [ -n "$S_BASE" ]; then echo "TF_VAR_openai_base_url=$S_BASE" >> "$GITHUB_ENV"
          elif [ -n "$V_BASE" ]; then echo "TF_VAR_openai_base_url=$V_BASE" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        run: terraform init

      - name: Terraform apply (ECR only, first pass)
        run: terraform apply -auto-approve -target=aws_ecr_repository.api

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eux
          REPO_URL="$(terraform output -raw ecr_repository_url)"
          docker build --platform linux/amd64 -f "${GITHUB_WORKSPACE}/docker/Dockerfile.backend" -t "${REPO_URL}:${IMAGE_TAG}" -t "${REPO_URL}:latest" "${GITHUB_WORKSPACE}"
          docker push "${REPO_URL}:${IMAGE_TAG}"
          docker push "${REPO_URL}:latest"

      - name: Terraform apply (full stack)
        run: terraform apply -auto-approve

      - name: Terraform outputs
        id: tfout
        run: |
          api_url="$(terraform output -raw api_base_url)"
          cf_id="$(terraform output -raw cloudfront_distribution_id)"
          web_bucket="$(terraform output -raw frontend_bucket_id)"
          test -n "$api_url"
          test -n "$cf_id"
          test -n "$web_bucket"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "cf_id=$cf_id" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$web_bucket" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        run: npm install -g pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build static frontend
        working-directory: frontend
        env:
          PUBLIC_MERIDIAN_API_BASE_URL: ${{ steps.tfout.outputs.api_url }}
        run: |
          test -n "$PUBLIC_MERIDIAN_API_BASE_URL"
          pnpm install
          pnpm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync "${GITHUB_WORKSPACE}/frontend/build" "s3://${{ steps.tfout.outputs.web_bucket }}/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ steps.tfout.outputs.cf_id }}" --paths "/*"
